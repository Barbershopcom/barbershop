name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @barbearia/schemas (deps de api e web)
        run: pnpm --filter @barbearia/schemas build

      - name: Generate Prisma Client
        run: pnpm --filter @barbearia/api prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # NOTE: testes rodam localmente. CI no postgres genérico não tem o role
  # `neondb_owner` que algumas migrations referenciam (ADR-002 §RLS).
  # Pra habilitar: setup do role + GRANT antes de prisma migrate deploy.
