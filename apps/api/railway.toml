# Railway config pro apps/api. Aponte o serviço pro root do repo e
# defina "Dockerfile Path" = apps/api/Dockerfile no dashboard.
#
# Variáveis sensíveis vão no dashboard (NÃO commitar):
#   DATABASE_URL, DIRECT_URL, SUPABASE_URL, SUPABASE_JWKS_URL,
#   SUPABASE_JWT_ISSUER, RESEND_API_KEY, EMAIL_FROM, PUBLIC_WEB_URL,
#   APPOINTMENT_CANCEL_SECRET, CORS_ORIGINS

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Railway injeta PORT automaticamente. main.ts já lê process.env.PORT.
